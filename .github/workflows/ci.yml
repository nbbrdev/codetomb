# Verificação de todo PR e de todo push na main (ADR-0009, docs/06-regras-dev.md §7).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serviço temporário, só para os testes: Postgres (RLS, roles). Senhas fictícias: tudo existe
    # apenas durante este job e some com a máquina. Mailpit entra na M1 e RustFS na M2, com os testes
    # que os usam (NBB-104 B5-A).
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codetomb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d codetomb"
          --health-interval 2s
          --health-retries 30
    env:
      DATABASE_URL_OWNER: postgres://codetomb_owner:codetomb_owner_ci@localhost:5432/codetomb
      DATABASE_URL_APP: postgres://app_user:app_user_ci@localhost:5432/codetomb
      DATABASE_URL_AUTH: postgres://app_auth:app_auth_ci@localhost:5432/codetomb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node (versão do .nvmrc) com cache do npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências (exatamente o lockfile)
        run: npm ci

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tipos (TypeScript)
        run: npm run typecheck

      # Mesmo roteiro da VPS: roles (superusuário) → migrations (codetomb_owner) → testes.
      - name: Banco de teste - roles
        run: >-
          psql "postgres://postgres:postgres@localhost:5432/codetomb"
          -v owner_password=codetomb_owner_ci
          -v app_user_password=app_user_ci
          -v app_auth_password=app_auth_ci
          -f db/bootstrap/roles.sql

      - name: Banco de teste - migrations
        run: npm run db:migrate

      # Unitários e integração numa execução só, para a cobertura somar os dois. Trava de 80%
      # (vitest.config.mts, NBB-103 W2-A).
      - name: Testes com cobertura (Vitest)
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # E2E: o app compilado no navegador (computador e celular emulado).
      - name: Navegador do Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Testes E2E (Playwright)
        run: npm run test:e2e

      # Só as dependências de produção (o que roda no servidor). Alertas em ferramentas de
      # desenvolvimento chegam pelo Dependabot, sem travar o CI (NBB-102 V1-A, docs/07 §11).
      - name: Auditoria de dependências
        run: npm audit --audit-level=high --omit=dev
