# Publica em PRODUÇÃO quando o usuário cria uma release (docs/06-regras-dev.md §4.1, ADR-0008):
#   gh release create vX.Y.Z --target main --generate-notes
# É o único caminho até a VPS: não há staging (ADR-0010).
#   verify (tag, commit na main, CI verde) → build da imagem → GHCR → SSH na VPS → deploy.sh
# A chave SSH da produção só consegue rodar `/opt/codetomb/bin/deploy.sh production` na VPS.
# Rollback de código: "Re-run all jobs" na execução de uma versão anterior.
name: Production

on:
  release:
    types: [published]

permissions: {}

# Um deploy de produção por vez, sem cancelar no meio (migration interrompida é pior que fila).
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    env:
      TAG: ${{ github.event.release.tag_name }}
      SHA: ${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Checkout (histórico completo, para comparar com a main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag no formato vX.Y.Z
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::A tag \"$TAG\" não segue o formato vX.Y.Z (ex.: v0.1.0)."
            exit 1
          fi

      - name: Commit da tag pertence à main
        run: |
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::O commit da tag $TAG ($SHA) não está na main. Crie a release com --target main."
            exit 1
          fi

      - name: CI verde nesse commit
        run: |
          passed=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=ci" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')
          if [ "$passed" -lt 1 ]; then
            echo "::error::O check \"ci\" do commit $SHA não passou (ou ainda não terminou). Espere o CI da main ficar verde e rode de novo."
            exit 1
          fi

  build:
    name: build
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image-ref: ${{ github.event.release.tag_name }}@${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout do commit da tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login no GHCR (token automático do Actions)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build e envio da imagem
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.event.release.tag_name }}
          build-args: NEXT_PUBLIC_APP_VERSION=${{ github.event.release.tag_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Os secrets VPS_* vêm do environment `production`, que só aceita tags v*.
    environment:
      name: production
      url: https://codetomb.nbbrdev.com
    permissions: {}
    env:
      IMAGE_REF: ${{ needs.build.outputs.image-ref }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      # Sem a VPS configurada, a release fica vermelha: uma versão publicada precisa chegar ao ar.
      - name: VPS configurada?
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ]; then
            echo "::error::Secrets VPS_* ausentes no environment production. Veja deploy/README.md."
            exit 1
          fi

      - name: Chave SSH e host conhecido
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # O texto enviado vira $SSH_ORIGINAL_COMMAND no deploy.sh, que valida o formato.
      - name: Deploy na VPS
        run: >-
          ssh -i ~/.ssh/deploy_key
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          -o BatchMode=yes
          "$VPS_USER@$VPS_HOST" "$IMAGE_REF"
