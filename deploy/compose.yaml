# Um ambiente do Codetomb na VPS (ADR-0007, docs/08-infra-deploy.md). O mesmo arquivo serve ao
# staging e à produção, cada um na sua pasta (/opt/codetomb/staging, /opt/codetomb/production) e no seu
# projeto do Compose (codetomb-staging, codetomb-production): redes e volumes separados, um não alcança
# o outro, e nada daqui alcança o Orçô.
#
# Quem roda é o deploy.sh, que copia este arquivo de dentro da imagem de cada versão:
#   docker compose -p codetomb-<ambiente> --env-file .env --env-file image.env run --rm migrate
#   docker compose -p codetomb-<ambiente> --env-file .env --env-file image.env up -d
# .env       segredos do ambiente, criado à mão na VPS (modelo: deploy/env.example)
# image.env  CODETOMB_IMAGE=ghcr.io/nbbrdev/codetomb:<tag>@sha256:<digest>, escrito pelo deploy.sh
#
# Serviços (NBB-106 E2-A): app, migrate e db. O RustFS (imagens) entra na M2.

# Logs limitados (10 MB × 3 por container) para não encher o disco.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  app:
    image: ${CODETOMB_IMAGE:?defina CODETOMB_IMAGE (image.env)}
    restart: unless-stopped
    # Só o Nginx da própria VPS alcança o app (127.0.0.1). Produção: 3010; staging: 3011.
    ports:
      - "127.0.0.1:${APP_PORT:?defina APP_PORT}:3000"
    # Lista explícita: o app recebe só o que usa (nunca a senha do superusuário do banco).
    # Variável nova do app? Adicione aqui e no deploy/env.example.
    environment:
      APP_ENV: ${APP_ENV:?defina APP_ENV}
      SITE_URL: ${SITE_URL:?defina SITE_URL}
      DATABASE_URL_APP: postgres://app_user:${APP_USER_PASSWORD}@db:5432/codetomb
      DATABASE_URL_AUTH: postgres://app_auth:${APP_AUTH_PASSWORD}@db:5432/codetomb
      STAGING_BASIC_AUTH_USER: ${STAGING_BASIC_AUTH_USER:-}
      STAGING_BASIC_AUTH_PASSWORD: ${STAGING_BASIC_AUTH_PASSWORD:-}
      PUBLIC_LAUNCH: ${PUBLIC_LAUNCH:-}
    # Hardening: sistema de arquivos só de leitura (menos o cache do Next e o /tmp, em memória),
    # nenhuma capacidade especial do Linux e sem ganhar privilégios depois de iniciar.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  # Tarefa avulsa (profile "tools": o `up` não a liga). Aplica as migrations com a role dona.
  migrate:
    image: ${CODETOMB_IMAGE:?defina CODETOMB_IMAGE (image.env)}
    profiles: [tools]
    working_dir: /app/migrator
    command: ["node", "scripts/migrate.mts"]
    environment:
      DATABASE_URL_OWNER: postgres://codetomb_owner:${CODETOMB_OWNER_PASSWORD}@db:5432/codetomb
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    # Porta só em 127.0.0.1 da VPS: a internet não alcança (e o ufw nem precisa liberar). Serve para o
    # backup manual pelo DBeaver, que entra por um túnel SSH (deploy/README.md, "Backup pelo DBeaver").
    # Produção: 5442; staging: 5443.
    ports:
      - "127.0.0.1:${DB_PORT:?defina DB_PORT}:5432"
    environment:
      # Superusuário só para a inicialização e a manutenção (backup pelo DBeaver). O app nunca o usa.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: codetomb
      # Lidas pelo init.sh na primeira inicialização (volume vazio) para criar as roles.
      CODETOMB_OWNER_PASSWORD: ${CODETOMB_OWNER_PASSWORD:?defina CODETOMB_OWNER_PASSWORD}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:?defina APP_USER_PASSWORD}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:?defina APP_AUTH_PASSWORD}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./roles.sql:/bootstrap/roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codetomb"]
      interval: 5s
      retries: 20
    security_opt: [no-new-privileges:true]
    logging: *logging

volumes:
  dbdata:
