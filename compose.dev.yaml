# Serviços locais de desenvolvimento (docs/06-regras-dev.md §6). Só em 127.0.0.1: nada fica
# acessível pela rede. Senhas fictícias, só deste ambiente local. Portas = as do Orçô + 10, para os
# dois projetos rodarem juntos (NBB-104 B1-A).
#   npm run db:start  → sobe tudo      npm run db:reset → apaga os dados e recria do zero
name: codetomb-dev

services:
  db:
    image: postgres:17.11-alpine
    environment:
      # Superusuário só para o script de inicialização criar as roles (db/bootstrap/roles.sql).
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codetomb
      CODETOMB_OWNER_PASSWORD: codetomb_owner_dev
      APP_USER_PASSWORD: app_user_dev
      APP_AUTH_PASSWORD: app_auth_dev
    ports:
      - "127.0.0.1:55442:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      # Roda uma única vez, com o volume vazio: cria as roles codetomb_owner, app_user e app_auth.
      - ./db/bootstrap/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./db/bootstrap/roles.sql:/bootstrap/roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codetomb"]
      interval: 2s
      retries: 30

  # Arquivos compatíveis com S3 (ADR-0004). API em :9010, console em :9011. Usado a partir da M2.
  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: codetomb_dev
      RUSTFS_SECRET_KEY: codetomb_dev_secret
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - rustfsdata:/data

  # Caixa de entrada de mentira (ADR-0006): SMTP em :1035, página em http://localhost:8035. Usado a
  # partir da M1.
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - "127.0.0.1:1035:1025"
      - "127.0.0.1:8035:8025"

volumes:
  dbdata:
  rustfsdata:
